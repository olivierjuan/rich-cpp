name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python (for oracle suite)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-venv
          python3 -m venv .venv
          .venv/bin/pip install rich==15.0.0

      - name: Configure
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            .venv/bin/python -m pip install --quiet rich==15.0.0 || true
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Run oracle suite (Linux only — needs Python Rich)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: .venv/bin/python tests/verify_oracle.py

      - name: Run test_runner
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/test_runner.exe
          else
            ./build/test_runner
          fi

      - name: Install
        shell: bash
        run: cmake --install build --prefix build/install

      - name: Downstream find_package smoke test
        shell: bash
        run: |
          cmake -B build/smoke -S examples/find_package_smoke \
                -DCMAKE_PREFIX_PATH="$(pwd)/build/install" \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build/smoke --config Release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp build/install/bin/rich_core.dll build/smoke/Release/
            ./build/smoke/Release/smoke_test.exe
          else
            LD_LIBRARY_PATH="$(pwd)/build/install/lib:$LD_LIBRARY_PATH" \
              ./build/smoke/smoke_test
          fi
